name: Maj quotidienne des taux

on:
  schedule:
    - cron: '0 5 * * *'   # Cible ~06h-07h UTC réel (délai GitHub ~1h) → disponible 08h Paris hiver / 09h Paris été
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-taux-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (branche de prod)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Met à jour route.ts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          WEBSTAT_API_KEY: ${{ secrets.WEBSTAT_API_KEY }}
          OILPRICEAPI_API_KEY: ${{ secrets.OILPRICEAPI_API_KEY }}
        run: node scripts/update-taux.mjs

      - name: Valider, committer et publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain -- public/taux.json)" ]]; then
            BASE_SHA="$(git rev-parse HEAD)"
            git add public/taux.json
            git commit -m "chore: maj taux $(TZ='Europe/Paris' date +'%Y-%m-%d %H:%M:%S')"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
              echo "main a changé pendant la collecte; publication annulée sans écrasement."
              exit 1
            fi
            git push origin HEAD:main
          else
            echo "Pas de changement à committer."
          fi
